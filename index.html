<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Over Panti - YouTube</title>
  
  <!-- Universal Preview Tags for All Apps -->
  <meta property="og:title" content="Over Panti - YouTube Channel">
  <meta property="og:description" content="Click here to subscribe to Over Panti!">
  <meta property="og:image" content="https://www.youtube.com/img/desktop/yt_120x120.png">
  <meta property="og:url" content="https://youtubeover-panti.github.io/subscribe/">
  <meta property="og:type" content="website">

  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .btn {
      background-color: #ff0000;
      color: white;
      padding: 14px 28px;
      border-radius: 28px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      display: inline-block;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #cc0000;
    }
    .note {
      font-size: 13px;
      color: #aaaaaa;
      margin-top: 15px;
      max-width: 300px;
    }
  </style>
  <script>
    window.onload = function() {
      var youtubeUrl = "https://www.youtube.com/@Over_panti?sub_confirmation=1";
      window.location.replace(youtubeUrl);
    };
  </script>
</head>
<body>
  <h2>Redirecting to Over Panti YouTube...</h2>
  <p>If the page doesn't open automatically, click below:</p>
  
  <a href="https://www.youtube.com/@Over_panti?sub_confirmation=1" class="btn" target="_blank">Open YouTube Channel</a>
  
  <p class="note">💡 Tip: Agar kisi app ke andar Gmail mange, toh upar diye hue button par click karke apne phone ke main browser ya YouTube App mein khol lein!</p>
</body>
</html>
