<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Over Panti - YouTube</title>
  
  <!-- Yeh tags Instagram, WhatsApp aur Facebook par YouTube ke logo aur title ke sath preview dikhayenge -->
  <meta property="og:title" content="Over Panti - YouTube Channel">
  <meta property="og:description" content="Click here to subscribe to Over Panti!">
  <meta property="og:image" content="https://www.youtube.com/img/desktop/yt_120x120.png">
  <meta property="og:url" content="https://youtubeover-panti.github.io/subscribe/">
  <meta property="og:type" content="website">

  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .btn {
      background-color: #ff0000;
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      display: inline-block;
    }
    .btn:hover {
      background-color: #cc0000;
    }
  </style>
  <script>
    // Yeh function load hote hi bina kisi galti ke seedha YouTube par bhej dega
    window.onload = function() {
      var youtubeUrl = "https://www.youtube.com/@Over_panti?sub_confirmation=1";
      window.location.replace(youtubeUrl);
    };
  </script>
</head>
<body>
  <h2>Redirecting to Over Panti YouTube...</h2>
  <p>If you are not redirected automatically, click the button below:</p>
  <a href="https://www.youtube.com/@Over_panti?sub_confirmation=1" class="btn">Open YouTube Channel</a>
</body>
</html>
