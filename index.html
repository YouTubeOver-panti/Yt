<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Over Panti - YouTube</title>
  
  <meta property="og:title" content="Over Panti - YouTube Channel">
  <meta property="og:description" content="Click here to subscribe to Over Panti!">
  <meta property="og:image" content="https://www.youtube.com/img/desktop/yt_120x120.png">
  <meta property="og:url" content="https://youtubeover-panti.github.io/subscribe/">
  <meta property="og:type" content="website">

  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #ff0000;
      color: white;
      padding: 16px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      display: inline-block;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
    }
    .btn:hover {
      background-color: #cc0000;
    }
    .note {
      font-size: 13px;
      color: #aaaaaa;
      margin-top: 25px;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>

  <script>
    // Page khulte hi yeh code direct YouTube App ko trigger karne ki koshish karega
    window.onload = function() {
      var intentUrl = "intent://www.youtube.com/@Over_panti?sub_confirmation=1#Intent;package=com.google.android.youtube;scheme=https;end;";
      // Automatic redirection
      window.location.href = intentUrl;
    };
  </script>
</head>
<body>

  <img src="https://www.youtube.com/img/desktop/yt_120x120.png" alt="YouTube Logo" class="logo">

  <h2>Over Panti YouTube Channel</h2>
  <p>Click below to open directly in YouTube App:</p>
  
  <!-- Yahan button par bhi direct Android Intent link laga di gayi hai -->
  <a href="intent://www.youtube.com/@Over_panti?sub_confirmation=1#Intent;package=com.google.android.youtube;scheme=https;end;" class="btn">Open in YouTube App</a>
  
  <p class="note">💡 Agar aap iPhone par hain ya app open na ho, toh yeh aapko browser ke zariye subscribe page par le jayega.</p>

</body>
</html>
