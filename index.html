<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Over Panti - YouTube</title>
  
  <!-- Universal Preview Tags -->
  <meta property="og:title" content="Over Panti - YouTube Channel">
  <meta property="og:description" content="Click here to subscribe to Over Panti!">
  <meta property="og:image" content="https://www.youtube.com/img/desktop/yt_120x120.png">
  <meta property="og:url" content="https://youtubeover-panti.github.io/subscribe/">
  <meta property="og:type" content="website">

  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #ff0000;
      color: white;
      padding: 16px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      display: inline-block;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
    }
    .btn:hover {
      background-color: #cc0000;
    }
    .note {
      font-size: 13px;
      color: #aaaaaa;
      margin-top: 25px;
      max-width: 320px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- YouTube Official Logo image on page -->
  <img src="https://www.youtube.com/img/desktop/yt_120x120.png" alt="YouTube Logo" class="logo">

  <h2>Over Panti YouTube Channel</h2>
  <p>Click the button below to subscribe instantly:</p>
  
  <!-- Yeh button seedha YouTube app ya browser mein kholega -->
  <a href="https://www.youtube.com/@Over_panti?sub_confirmation=1" class="btn" target="_blank">Open YouTube Channel</a>
  
  <p class="note">💡 <b>Note:</b> Agar aap Instagram ya kisi app ke andar hain, toh upar diye hue button par click karein. Yeh aapko seedha YouTube app par le jayega!</p>

</body>
</html>
