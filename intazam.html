<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Over Panti - YouTube</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .btn {
      background-color: #ff0000;
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      display: inline-block;
    }
  </style>
  <script>
    function redirectToApp() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      // Aapke YouTube channel ka link yahan set hai (subscribe popup ke sath)
      var targetUrl = "https://www.youtube.com/@Over_panti?sub_confirmation=1";

      if (isAndroid) {
        window.location.replace(targetUrl);
      } else if (isIOS) {
        window.location.replace(targetUrl);
      } else {
        window.location.replace(targetUrl);
      }
    }

    window.onload = function() {
      redirectToApp();
    };
  </script>
</head>
<body>
  <h2>Redirecting to Over Panti YouTube...</h2>
  <p>If you are not redirected automatically, click the button below:</p>
  <a href="https://www.youtube.com/@Over_panti?sub_confirmation=1" class="btn" target="_blank">Open YouTube Channel</a>
</body>
</html>
