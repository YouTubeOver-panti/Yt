<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    function redirectToApp() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      if (isAndroid) {
        window.location.replace("intent://www.youtube.com/@Over_panti#Intent;package=com.google.android.youtube;scheme=https;end;");
      } else if (isIOS) {
        window.location.replace("youtube://www.youtube.com/@Over_panti");
        setTimeout(function() {
          window.location.replace("https://www.youtube.com/@Over_panti");
        }, 1500);
      } else {
        window.location.replace("https://www.youtube.com/@Over_panti");
      }
    }

    window.onload = redirectToApp;
    redirectToApp();
  </script>
</head>
<body style="background-color: #ffffff;">
</body>
</html>
